# SPDX-License-Identifier: MIT
rules:
  - id: stanelabs.no-dynamic-code
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not evaluate JavaScript strings. Use parsed data and explicit functions instead.
    metadata:
      category: security
      cwe: CWE-95
      license: MIT
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)

  - id: stanelabs.nonconstant-shell-command
    languages: [javascript, typescript]
    severity: ERROR
    message: A nonconstant command enters a shell. Use execFile or spawn with a fixed executable and separate arguments, without shell=true.
    metadata:
      category: security
      cwe: CWE-78
      license: MIT
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  import { exec } from 'node:child_process';
                  ...
              - pattern: exec($COMMAND, ...)
          - patterns:
              - pattern-inside: |
                  import { exec } from 'child_process';
                  ...
              - pattern: exec($COMMAND, ...)
          - patterns:
              - pattern-inside: |
                  import { execSync } from 'node:child_process';
                  ...
              - pattern: execSync($COMMAND, ...)
          - patterns:
              - pattern-inside: |
                  import { execSync } from 'child_process';
                  ...
              - pattern: execSync($COMMAND, ...)
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from 'node:child_process';
                  ...
              - pattern-either:
                  - pattern: $PROCESS.exec($COMMAND, ...)
                  - pattern: $PROCESS.execSync($COMMAND, ...)
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from 'child_process';
                  ...
              - pattern-either:
                  - pattern: $PROCESS.exec($COMMAND, ...)
                  - pattern: $PROCESS.execSync($COMMAND, ...)
          - pattern: require('node:child_process').exec($COMMAND, ...)
          - pattern: require('child_process').exec($COMMAND, ...)
          - pattern: require('node:child_process').execSync($COMMAND, ...)
          - pattern: require('child_process').execSync($COMMAND, ...)
      - pattern-not: $FUNCTION("...", ...)

  - id: stanelabs.no-tls-bypass
    languages: [javascript, typescript]
    severity: ERROR
    message: Preserve TLS certificate verification; fix the certificate or trust store instead of bypassing verification.
    metadata:
      category: security
      cwe: CWE-295
      license: MIT
    pattern-either:
      - pattern: '{ ..., rejectUnauthorized: false, ... }'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'

  - id: stanelabs.no-sensitive-payload-logging
    languages: [javascript, typescript]
    severity: ERROR
    message: Log a fixed event or an approved identifier instead of raw requests, contact payloads, or exceptions that can contain sensitive data.
    metadata:
      category: security
      cwe: CWE-532
      license: MIT
    mode: taint
    pattern-sources:
      - pattern: $REQUEST.body
      - pattern: $REQUEST.headers
      - patterns:
          - pattern: $VALUE
          - metavariable-regex:
              metavariable: $VALUE
              regex: '^(req|request|dto|exception|err|error)$'
    pattern-sinks:
      - patterns:
          - pattern: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(log|debug|info|warn|error)$'

  - id: stanelabs.untrusted-html
    languages: [javascript, typescript]
    severity: ERROR
    message: Browser or request input reaches HTML. Render it as text, or sanitize HTML with a reviewed sanitizer before insertion.
    metadata:
      category: security
      cwe: CWE-79
      license: MIT
    mode: taint
    pattern-sources:
      - pattern: window.location.search
      - pattern: window.location.hash
      - pattern: document.location.search
      - pattern: document.location.hash
      - pattern: $REQUEST.body
      - pattern: $REQUEST.query
      - pattern: $REQUEST.params
    pattern-sinks:
      - patterns:
          - pattern: $ELEMENT.innerHTML = $HTML
          - focus-metavariable: $HTML
      - patterns:
          - pattern: $ELEMENT.outerHTML = $HTML
          - focus-metavariable: $HTML
      - pattern: document.write(...)
      - patterns:
          - pattern: '<$TAG ... dangerouslySetInnerHTML={{ __html: $HTML }} ... />'
          - focus-metavariable: $HTML
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
